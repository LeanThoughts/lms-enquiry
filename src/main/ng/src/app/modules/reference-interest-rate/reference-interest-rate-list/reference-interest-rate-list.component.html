<fd-dynamic-page size="large" [autoResponsive]="true">
    <fd-dynamic-page-header headingLevel="2" title="Reference Interest Rates"
        subtitle="Maintain reference interest values and send changes for approval"
        [style.margin-top.rem]="1">
        <fd-dynamic-page-global-actions>
            <fd-toolbar fdType="transparent" [clearBorder]="true">
                <button fd-button
                    fd-toolbar-item
                    fdType="positive"
                    label="Send for Approval"
                    [disabled]="isSendForApprovalDisabled()"
                    (click)="sendForApproval()"
                >
                </button>
            </fd-toolbar>
        </fd-dynamic-page-global-actions>
    </fd-dynamic-page-header>
    <fd-dynamic-page-content>
        <div fd-form-item [style.max-width.rem]="25" [style.margin-bottom.rem]="1">
            <label fd-form-label for="referenceRateType" [required]="true">Reference Rate Type</label>
            <fd-select id="referenceRateType"
                placeholder="Select a reference rate type"
                [(value)]="selectedReferenceRateType"
                (valueChange)="onReferenceRateTypeChange()"
            >
                @for (option of referenceRateTypes; track option.id) {
                    <li fd-option [value]="option">{{ option.code }} - {{ option.description }}</li>
                }
            </fd-select>
        </div>

        @if (selectedReferenceRateType) {
            <app-generic-list
                [entity]="'referenceInterestRateValues'"
                [searchString1]="selectedReferenceRateTypeId"
            />
        }
        @else {
            <p [style.color]="'var(--sapContent_LabelColor)'">Select a reference rate type to view its interest values.</p>
        }
    </fd-dynamic-page-content>
</fd-dynamic-page>
