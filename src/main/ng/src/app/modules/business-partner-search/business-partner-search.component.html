<fd-dynamic-page size="large" [autoResponsive]="true">
    <fd-dynamic-page-header headingLevel="2" title="Search Business Partners"
        subtitle="Search Business Partners by Name, Email, PAN, Search Term, Partner Role or Business Partner Number" [style.margin-top.rem]="1">
        <!-- <fd-dynamic-page-breadcrumb>
            <fd-breadcrumb>
                <fd-breadcrumb-item>
                    <a fd-link href="business-partners">Business Partners</a>
                </fd-breadcrumb-item>
            </fd-breadcrumb>
        </fd-dynamic-page-breadcrumb> -->
        <fd-dynamic-page-global-actions>
            <fd-toolbar fdType="transparent" [clearBorder]="true" [size]="'compact'">
                <ng-container [fdCompact]="'compact'">
                    <button fd-toolbar-item fd-button fdCompact fdType="positive" (click)="createBusinessPartner()"
                        label="Create" title="Create">
                    </button>
                    <button fd-toolbar-item fd-button fdCompact fdType="negative" (click)="updateBusinessPartner()"
                        label="Update" title="Update" [disabled]="!selectedBusinessPartner">
                    </button>
                    <button fd-toolbar-item fd-button fdCompact fdType="negative" (click)="viewBusinessPartner()"
                        label="View" title="View" [disabled]="!selectedBusinessPartner">
                    </button>
                    <fd-toolbar-separator></fd-toolbar-separator>
                    <button fd-button fdType="transparent" aria-label="Close" title="Close" (click)="router.navigate(['homepage'])">
                        <i class="sap-icon--decline"></i>
                    </button>
                </ng-container>
            </fd-toolbar>
        </fd-dynamic-page-global-actions>
    </fd-dynamic-page-header>
    <fd-dynamic-page-content cdkScrollable>
        <form [formGroup]="businessPartnerSearchForm" (ngSubmit)="searchBusinessPartners()">
            <fd-layout-grid [noGap]="true">
                <div fdLayoutGridRow style="height: auto;">
                    <div [fdLayoutGridCol]="4">
                        <div fd-form-set>
                            <div fd-form-item>
                                <label fd-form-label for="partnerName">Business Partner Name:</label>
                                <input id="partnerName" formControlName="partnerName" fd-form-control type="text" tabindex="1" />
                            </div>
                            <div fd-form-item>
                                <label fd-form-label for="searchTerm">Search Term:</label>
                                <input id="searchTerm" formControlName="searchTerm" fd-form-control type="text" tabindex="4"
                                    title="Search term 1 or search term 2 of the business partner" />
                            </div>
                            <div fd-form-item>
                                <label fd-form-label for="partnerNumberFrom">Business Partner Number From:</label>
                                <input id="partnerNumberFrom" formControlName="partnerNumberFrom" fd-form-control type="text" tabindex="6" />
                            </div>
                        </div>
                    </div>
                    <div [fdLayoutGridCol]="4" [style.padding-left.rem]="1">
                        <div fd-form-set>
                            <div fd-form-item>
                                <label fd-form-label for="email">Registered Email:</label>
                                <input id="email" formControlName="email" fd-form-control type="email" tabindex="2" />
                            </div>
                            <div fd-form-item>
                                <label fd-form-label for="partnerRole">Partner Role:</label>
                                <select id="partnerRole" formControlName="partnerRole" class="bp-search__select" tabindex="5"
                                    title="Default partner role of the business partner">
                                    <option value="">All roles</option>
                                    @for (role of partnerRoles; track role.code) {
                                        <option [value]="role.code">{{ role.value ? role.value + ' (' + role.code + ')' : role.code }}</option>
                                    }
                                </select>
                            </div>
                            <div fd-form-item>
                                <label fd-form-label for="partnerNumberTo">Business Partner Number To:</label>
                                <input id="partnerNumberTo" formControlName="partnerNumberTo" fd-form-control type="text" tabindex="7" />
                            </div>
                        </div>
                    </div>
                    <div [fdLayoutGridCol]="4" [style.padding-left.rem]="1" [style.padding-right.rem]="1">
                        <div fd-form-set>
                            <div fd-form-item>
                                <label fd-form-label for="panNumber">PAN Number:</label>
                                <input id="panNumber" formControlName="panNumber" fd-form-control type="text" maxlength="10" tabindex="3" />
                            </div>
                        </div>
                    </div>
                </div>
                <div fdLayoutGridRow>
                    <div [fdLayoutGridCol]="12" [style.margin-top.rem]="1">
                        <button fd-button fdType="emphasized" label="Search" type="submit" [disabled]="searching"></button>
                        <button fd-button fdType="emphasized" label="Clear" type="button" style="margin-left: 0.5rem;"
                            (click)="clearSearch()">
                        </button>
                    </div>
                </div>
            </fd-layout-grid>
        </form>

        <fd-layout-grid [noGap]="true" class="component-grid">
            <div fdLayoutGridRow style="height: auto;" [style.margin-top.rem]="1">
                <div [fdLayoutGridCol]="12">
                    <app-business-partner-list [businessPartners]="businessPartners" [total]="result?.total ?? 0"
                        [page]="page" [size]="size" [searched]="!!result"
                        (pageChange)="goToPage($event)" (pageSizeChange)="setPageSize($event)"></app-business-partner-list>
                </div>
            </div>
        </fd-layout-grid>
    </fd-dynamic-page-content>
</fd-dynamic-page>
