<div class="dialog-content-wrapper">
    <mat-toolbar matDialogTitle class="mat-accent m-0">
        <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center">
            <span class="title dialog-title">{{ dialogTitle }}</span>
            <button mat-button class="mat-icon-button" (click)="_dialogRef.close({ 'refresh': false })" aria-label="Close Dialog">
                <mat-icon>close</mat-icon>
            </button>
        </mat-toolbar-row>
    </mat-toolbar>
    <div mat-dialog-content fusePerfectScrollbar style="padding: 16px !important;">
        <form [formGroup]="iccApprovalForm">
            <div fxLayout="row">
                <mat-form-field fxFlex="50">
                    <input matInput placeholder="Meeting Number" formControlName="meetingNumber" maxlength="10" required>
                </mat-form-field>
                <mat-form-field fxFlex="50">
                    <input matInput [matDatepicker]="picker2" [min]="enquiryCompletion.date" [max]="today" placeholder="Date of ICC clearance" formControlName="meetingDate" readonly>
                    <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                    <mat-datepicker #picker2></mat-datepicker> 
                </mat-form-field>
            </div>
            <div fxLayout="row">
                <mat-form-field fxFlex="100">
                    <input matInput placeholder="Remarks" formControlName="remarks" maxlength="200" required>
                </mat-form-field>
            </div>
            <ng-container *ngIf="iccApprovalForm.get('meetingDate').value">
                <div fxLayout="row">
                    <mat-form-field fxFlex="50">
                        <input matInput [matDatepicker]="picker4" [min]="iccApprovalForm.get('meetingDate').value" [max]="today" placeholder="CFO Signing Date of ICC Minutes" 
                                formControlName="cfoApprovalDate" readonly>
                        <mat-datepicker-toggle matSuffix [for]="picker4"></mat-datepicker-toggle>
                        <mat-datepicker #picker4></mat-datepicker> 
                    </mat-form-field>
                    <mat-form-field fxFlex="50">
                        <input matInput [matDatepicker]="picker3" [min]="iccApprovalForm.get('cfoApprovalDate').value" [max]="today"placeholder="ED Signing Date of ICC Minutes" 
                                formControlName="edApprovalDate" readonly>
                        <mat-datepicker-toggle matSuffix [for]="picker3"></mat-datepicker-toggle>
                        <mat-datepicker #picker3></mat-datepicker> 
                    </mat-form-field>
                </div>
            </ng-container>
            <div fxLayout="row">
                <mat-form-field fxFlex="50">
                    <mat-select placeholder="Document Type (Minutes)" formControlName="documentTypeMinutes">
                      <mat-option> </mat-option>
                      <mat-option *ngFor="let documentType of documentTypes" [value]="documentType.code">
                        {{ documentType.value }}
                      </mat-option>
                    </mat-select>
                </mat-form-field>
                <div fxFlex="50">
                    <div fxLayout="column">
                        <label for="document1">Upload Minutes Document</label>
                        <input type="file" name="file1" (change)="onFile1Select($event)" accept="application/pdf" id="document1" required/>
                    </div>
                </div>
            </div>
            <div fxLayout="row" class="mt-16">
                <mat-form-field fxFlex="50">
                    <mat-select placeholder="Document Type (Mail from Company Secretary/Internal Note Sheet)" formControlName="documentTypeMailFromCS">
                      <mat-option> </mat-option>
                      <mat-option *ngFor="let documentType of documentTypes" [value]="documentType.code">
                        {{ documentType.value }}
                      </mat-option>
                    </mat-select>
                </mat-form-field>
                <div fxFlex="50">
                    <div fxLayout="column">
                        <label for="document2">Mail from Company Secretary/Internal Note Sheet</label>
                        <input type="file" name="file2" (change)="onFile2Select($event)" accept="application/pdf" id="document2" required/>
                    </div>
                </div>
            </div>

            <div mat-dialog-actions fxLayout="row" class="mb-8">
                <button class="mr-8" mat-raised-button type="submit" color="accent" (click)="submit()">
                    Submit
                </button>
                <button class="mr-8" mat-raised-button type="button" color="accent" (click)="_dialogRef.close({ 'refresh': false })">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
