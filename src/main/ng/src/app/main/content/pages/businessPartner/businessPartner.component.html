<div id="tickers" class="page-layout simple" fusePerfectScrollbar>

    <!-- HEADER -->
    <div class="sub-header p-6 blue-grey-200-bg" fxLayout="row" fxLayoutAlign="space-between center">

        <!-- BREADCRUMB -->
        <div class="breadcrumb text-truncate h4 pl-24 pt-12 pb-12" fxLayout="row" fxLayoutAlign="start center"
            *fuseIfOnDom [@animate]="{value:'*',params:{x:'50px'}}">
            {{ title }}
            <br>
            Workflow Status: {{ workflowStatus }}
        </div>
        <!-- / BREADCRUMB -->
        <!-- TOOLBAR -->
        <div class="toolbar" fxLayout="row" fxLayoutAlign="end">
            <button mat-raised-button class="mr-8 mb-8" (click)="sendForApproval()">
                <mat-icon matSuffix class="mr-8">check</mat-icon>Send for Approval
            </button>
        </div>
        <!-- / TOOLBAR -->
    </div>
    <!-- / HEADER -->

    <!-- CONTENT -->
    <div class="content p-16">

        <div class="content-card mat-white-bg mat-elevation-z4 p-16" fusePerfectScrollbar style="width: 100%">
            <mat-expansion-panel [expanded]="expandPanel1" hideToggle="false">
                <mat-expansion-panel-header>
                    <mat-panel-title>
                        Business Partner Roles
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <div fxLayout="row">
                    <mat-form-field fxFlex="25">
                        <mat-select placeholder="Select Business Partner Role" [formControl]="businessPartnerRole" required>
                            <mat-option value="">Select Role</mat-option>
                            <mat-option *ngFor="let businessPartnerRole of businessPartnerRoles" [value]="businessPartnerRole">
                                {{ businessPartnerRole.value }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                    <button mat-raised-button (click)="addRoleToBusinessPartner()" style="margin: 12px; height: fit-content;">
                        Add Role
                    </button>     
                </div>

                <div class="mat-table-container mt-16" mat-white-bg style="width: 100%">
                    <div fxLayout="row">
                        <div class="ml-4"><p>Selected Roles: {{ getSelectedRoles() }}</p></div>
                    </div>
                </div>
            </mat-expansion-panel>
        </div>

        <mat-tab-group class="mt-16">
            <mat-tab label="Partner Details">
                <fuse-partner-update></fuse-partner-update>
            </mat-tab>

            <mat-tab label="Contact Details">
                <fuse-business-partner-contact-details-list></fuse-business-partner-contact-details-list>
            </mat-tab>

            <mat-tab label="Bank Details">
                <fuse-business-partner-bank-details-list></fuse-business-partner-bank-details-list>
            </mat-tab>

            <mat-tab label="Industry Details">
                <fuse-business-partner-industry-list></fuse-business-partner-industry-list>
            </mat-tab>
        </mat-tab-group>
        <!-- / CONTENT -->
    </div>
</div>
